<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="../bootstrap/bootstrap-5.3.3-dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="../css/popup.css">

</head>

<body class="d-flex justify-content-center flex-column">
    <div class="text-center" id="popupTitle">Fixette</div>
    <div class="mt-1 vstack d-flex">
        <div class="separator"><span class="flavorText">Museum</span></div>
        <div class="mt-1 col musOptions" id="musOptions">
            <div class="form-check">
                <label>
                    <input type="radio" id="Choose_MetMuseum" name="musOptions" value="Met" checked="true">
                    The Met
                </label>
            </div>
            <div class="form-check">
                <label>
                    <input type="radio" id="Choose_NGADCMuseum" name="musOptions" value="NGADC">
                    The National Gallery of Art (D.C.)
                </label>
            </div>
        </div>
        <div class="separator"><span class="flavorText">Options</span></div>

        <select id="searchOptionsSelect" class="form-select mb-2 form-select-sm" aria-label="Options">
            <option value="0" selected>Number of images</option>
            <option hidden value="1">AI insight</option>
            <option value="2">Complementary informations</option>
            <option value="3">Set image as Background</option>
            <option value="4">Pin image</option>
        </select>

        <div id="NumImgsOptions">
            <label id="numDailyImgsRangeText" for="numDailyImgsRange" class="form-label">
                <img src="../imgs/icons/info-circle.svg" class="bi bi-info-circle"
                    title="Choose the number of images to cycle throughout a day. &#013;The higher the number the longer the loading time when &#013;you click on 'Paint!'"></img>
                Number of images per day : <span id="numberDailyImgsTextValue"> 4 </span></label>
            <input id="numDailyImgsRange" type="range" class="form-range" min="0" max="6" value=3 step="1"
                list="markers">
            <datalist id="markers">
                <option value="1">1</option>
                <option value="12.5">2</option>
                <option value="25">3</option>
                <option value="37.5">4</option>
                <option value="50">6</option>
                <option value="62.5">8</option>
                <option value="85">12</option>
                <option value="97.5">24</option>
            </datalist>
        </div>

        <div hidden id="EnableAIOptions" class="form-check form-switch">
            <label id="EnableAIText" for="EnableAICheck" class="form-label">Enable AI insight</label>
            <input id="enableAISelect" class="form-check-input" type="checkbox" role="switch">
        </div>

        <div hidden id="EnableImagesInfoOptions">
            <div class="form-check-inline form-check form-switch ">
                <label id="EnableImagesInfoText" for="EnableImagesInfoCheck" class="form-label">Display informations
                    from the museum <img src="../imgs/icons/info-circle.svg" class="bi bi-info-circle"
                        title="Those informations are some of those the museum decided to make available. &#013;They are correct and verifiable but aren't the same museum to museum"></img></label>
                <input id="enableImagesInfoSelect" class="form-check-input " type="checkbox" role="switch" checked>
            </div>
        </div>

        <div hidden id="SetBackgroundImageOptions">
            <div class="form-check-inline form-check form-switch ">
                <label id="SetBackgroundImageText" for="SetBackgroundImageCheck" class="form-label">Set image on
                    display as tab's background
                    <img src="../imgs/icons/info-circle.svg" class="bi bi-info-circle"
                        title="Set the image of the art on display as the full background of your newtab instead &#013;of having it in a container. Proportions might get strange"></img>
                </label>
                <input id="setBackgroundImageSelect" class="form-check-input " type="checkbox" role="switch" checked>
            </div>
        </div>

        <div hidden id="PinToThisImageOptions">
            <div class="form-check-inline form-check form-switch ">
                <label id="PinToThisImageText" for="PinToThisImageCheck" class="form-label">Pin the image currently on
                    display
                    <img src="../imgs/icons/info-circle.svg" class="bi bi-info-circle"
                        title="This will stop the image from changing both manually with 'Paint!' and automatically over time until you disable it">
                    </img>
                </label>
                <input id="pinToThisImageSelect" class="form-check-input " type="checkbox" role="switch">
            </div>
        </div>

        <button id="searchOptButton" type="button" class="btn btn-outline-primary btn-sm">Save</button>

        <div class="mt-3 separator"><img id="fixettePopUpLogo" src="../imgs/icons/fixette_logo_500.png" width="16"
                height="16"></div>

        <div class="mt-2 col text-center">
            <button type="button" class="btn btn-info" id="callButton"><span hidden id="buttonSpinner"
                    class="spinner-border spinner-border-sm" aria-hidden="true"></span> Paint !</button>
        </div>
    </div>
    <div class="mt-auto pb-2 text-center" id="remerciements">
        <a target="_blank" href="options_page.html">Thanks | Contact | Info </a><br>
        <span id="iconsAcknowledgment"> Eyes icons by <a target="_blank" href="https://icons8.com">Icons8</a></span><br>
    </div>
</body>
<script type="module" src="../js/popupHandler.js"></script>

</html>
